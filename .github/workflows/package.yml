name: Package game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          node --check main.js
          node --check scripts/fetch-osm-snapshot.mjs
          node --check scripts/fetch-ms-buildings.mjs
          node --check scripts/build-web.mjs

      - name: Generate evidence-gated overrides
        run: node scripts/build-verified-overrides.mjs

      - name: Fetch Microsoft building footprints
        run: node scripts/fetch-ms-buildings.mjs

      - name: Verify Microsoft building footprints
        run: |
          test -s data/ms-buildings.geojson
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/ms-buildings.geojson','utf8')); if(!Array.isArray(d.features)||d.features.length<10) process.exit(1); console.log('Microsoft buildings:',d.features.length)"

      - name: Fetch reproducible OSM snapshot
        run: node scripts/fetch-osm-snapshot.mjs --required

      - name: Verify bundled map snapshot
        run: |
          test -s data/osm-snapshot.json
          node -e "const d=require('./data/osm-snapshot.json'); if(!Array.isArray(d.elements)||d.elements.length<10) process.exit(1); console.log('OSM snapshot elements:',d.elements.length)"

      - name: Fetch real 4K quality assets
        run: node scripts/fetch-quality-assets.mjs

      - name: Verify real quality assets
        run: |
          test -s assets/quality/manifest.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('assets/quality/manifest.json','utf8')); if((d.total_bytes||0)<80000000) process.exit(1); console.log('quality assets MiB:',(d.total_bytes/1024/1024).toFixed(1))"

      - name: Build self-contained web app
        run: npm run build:web

      - name: Build portable ZIP
        run: |
          cd dist/site
          zip -r ../H_GAME-web.zip .
          cd ..
          sha256sum H_GAME-web.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: H_GAME-web
          path: |
            dist/H_GAME-web.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
