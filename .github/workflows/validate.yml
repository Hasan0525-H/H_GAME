name: Validate game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check main.js
      - name: Check required files
        run: test -f index.html && test -f styles.css && test -f data/reference-sources.json
