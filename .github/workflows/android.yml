name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate evidence-gated overrides
        run: node scripts/build-verified-overrides.mjs

      - name: Fetch Microsoft building footprints
        run: node scripts/fetch-ms-buildings.mjs

      - name: Verify Microsoft building footprints
        run: |
          test -s data/ms-buildings.geojson
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/ms-buildings.geojson','utf8')); if(!Array.isArray(d.features)||d.features.length<10) process.exit(1); console.log('Microsoft buildings:',d.features.length)"

      - name: Fetch required bundled map snapshot
        run: node scripts/fetch-osm-snapshot.mjs --required

      - name: Verify bundled map snapshot
        run: |
          test -s data/osm-snapshot.json
          node -e "const d=require('./data/osm-snapshot.json'); if(!Array.isArray(d.elements)||d.elements.length<10) process.exit(1); console.log('OSM snapshot elements:',d.elements.length)"

      - name: Build self-contained web assets
        run: npm run build:web

      - name: Prepare web assets
        run: |
          rm -rf www
          cp -r dist/site www

      - name: Create Android project
        run: npx cap add android

      - name: Keep stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hgame-android-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=H_GAME Debug,O=H_GAME,C=SA"
          fi

      - name: Copy web assets into Android
        run: npx cap copy android

      - name: Set increasing version
        shell: bash
        run: |
          CODE="${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${CODE}\"/" android/app/build.gradle

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Generate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: H_GAME-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
